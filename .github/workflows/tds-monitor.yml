name: Tuya TDS Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

concurrency:
  group: tuya-tds-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read TDS and send Telegram notifications
        id: tds
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TDS_GROUP_ID: ${{ secrets.TELEGRAM_TDS_GROUP_ID }}
          TELEGRAM_ALERTS_GROUP_ID: ${{ secrets.TELEGRAM_ALERTS_GROUP_ID }}
          TUYA_BOOTSTRAP_SESSION: ${{ secrets.TUYA_BOOTSTRAP_SESSION }}
          TUYA_FERNET_KEY: ${{ secrets.TUYA_FERNET_KEY }}
        run: python monitor.py

      - name: Save encrypted monitoring state
        if: always()
        run: |
          if [ -f tds_state.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add tds_state.enc

            if ! git diff --cached --quiet; then
              git commit -m "Update encrypted TDS state [skip ci]"
              git push
            else
              echo "No state changes to save"
            fi
          else
            echo "No encrypted state file found"
          fi

      - name: Check monitoring result
        if: always()
        env:
          MONITOR_RESULT: ${{ steps.tds.outcome }}
        run: |
          if [ "$MONITOR_RESULT" != "success" ]; then
            echo "TDS monitoring failed"
            exit 1
          fi