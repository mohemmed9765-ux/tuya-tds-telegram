name: Tuya TDS Monitor

on:
  workflow_dispatch:
    inputs:
      manual_tds:
        description: "Send a fresh TDS reading to maintenance group"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tuya-tds-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Read TDS and send Telegram notifications
        id: tds
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TDS_GROUP_ID: ${{ secrets.TELEGRAM_TDS_GROUP_ID }}
          TELEGRAM_ALERTS_GROUP_ID: ${{ secrets.TELEGRAM_ALERTS_GROUP_ID }}
          TUYA_BOOTSTRAP_SESSION: ${{ secrets.TUYA_BOOTSTRAP_SESSION }}
          TUYA_FERNET_KEY: ${{ secrets.TUYA_FERNET_KEY }}
          FORCE_READ: ${{ inputs.manual_tds && '1' || '0' }}
        run: python monitor.py

      - name: Save encrypted monitoring state
        id: save
        if: always()
        run: |
          if [ -f tds_state.enc ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add tds_state.enc

            if ! git diff --cached --quiet; then
              git commit -m "Update encrypted TDS state [skip ci]"
              git push
            else
              echo "No state changes to save"
            fi
          else
            echo "Encrypted state file missing"
            exit 1
          fi

      - name: Report status to Healthchecks
        if: always()
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          MONITOR_RESULT: ${{ steps.tds.outcome }}
          SAVE_RESULT: ${{ steps.save.outcome }}
        run: |
          if [ -z "$HEALTHCHECKS_PING_URL" ]; then
            echo "HEALTHCHECKS_PING_URL is missing"
            exit 1
          fi

          if [ "$MONITOR_RESULT" = "success" ] && [ "$SAVE_RESULT" = "success" ]; then
            echo "Reporting monitoring success"
            PING_URL="$HEALTHCHECKS_PING_URL"
          else
            echo "Reporting monitoring failure"
            PING_URL="${HEALTHCHECKS_PING_URL%/}/fail"
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 2 \
            --max-time 10 \
            "$PING_URL"

      - name: Verify monitoring result
        if: always()
        env:
          MONITOR_RESULT: ${{ steps.tds.outcome }}
          SAVE_RESULT: ${{ steps.save.outcome }}
        run: |
          if [ "$MONITOR_RESULT" != "success" ]; then
            echo "TDS monitoring failed"
            exit 1
          fi

          if [ "$SAVE_RESULT" != "success" ]; then
            echo "Encrypted state could not be saved"
            exit 1
          fi

          echo "Monitoring completed successfully"